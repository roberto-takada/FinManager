<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      Content Security Policy (ENGENHARIA_DE_SOFTWARE §6.3, ADR-0005).
      Fica em <meta> porque o GitHub Pages não permite cabeçalhos HTTP, e precisa ser
      o primeiro elemento relevante do <head>, antes de qualquer script ou estilo.
      - connect-src 'self': nenhum dado sai do navegador (RN-011).
      - 'wasm-unsafe-eval': exigido pelo Argon2id em WebAssembly (ADR-0001).
      - style-src 'unsafe-inline': o Angular injeta <style> dos componentes em tempo de
        execução; um nonce não traz proteção real em hospedagem estática.
      - Trusted Types: só as políticas internas do Angular podem gerar HTML/scripts.
      - frame-ancestors não funciona em <meta>; a proteção contra iframe está em
        src/app/core/seguranca/anti-clickjacking.ts (RNF-064).
      Testado por e2e/seguranca.spec.ts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; require-trusted-types-for 'script'; trusted-types angular angular#bundler"
    />
    <meta name="referrer" content="no-referrer" />
    <title>FinManager</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gerenciador de finanças pessoais local-first com criptografia ponta a ponta."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
