<a
  href="#conteudo"
  class="sr-only rounded-md bg-white px-4 py-2 foco focus:not-sr-only focus:absolute focus:top-2 focus:left-2"
  >Pular para o conteúdo</a
>

<header class="border-b border-gray-300 bg-white print:hidden">
  <div class="mx-auto flex max-w-3xl flex-wrap items-center justify-between gap-3 px-4 py-3">
    <p class="text-xl font-bold text-gray-900">FinManager</p>
    @if (cofre.desbloqueado()) {
      <nav aria-label="Principal" class="flex flex-wrap items-center gap-4">
        <a
          class="link"
          routerLink="/"
          routerLinkActive="font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          >Início</a
        >
        <a
          class="link"
          routerLink="/seguranca"
          routerLinkActive="font-semibold"
          ariaCurrentWhenActive="page"
          >Segurança</a
        >
        <button type="button" class="botao-secundario" (click)="bloquear()">Bloquear cofre</button>
      </nav>
    }
  </div>
</header>

<main id="conteudo" class="mx-auto max-w-3xl px-4 py-8">
  <router-outlet />
</main>
