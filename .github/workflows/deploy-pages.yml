# Publica o FinManager no GitHub Pages a cada push na main (ADR-0005).
# Antes de publicar, roda as verificações rápidas; se alguma falhar, nada é publicado.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar manualmente pela aba "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um novo push cancela o que ainda está na fila.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar (formatação, lint, tipos e testes unitários)
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test --watch=false

      - name: Build para o GitHub Pages
        run: pnpm build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/finmanager/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
